services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cite_password}
      POSTGRES_DB: ${POSTGRES_DB:-cite_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cite_user} -d ${POSTGRES_DB:-cite_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cite-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cite-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cite_user}:${POSTGRES_PASSWORD:-cite_password}@db:5432/${POSTGRES_DB:-cite_db}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-groq,gemini,mock}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn apps.api.src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir apps/api/src --reload-dir packages

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: cite-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cite_user}:${POSTGRES_PASSWORD:-cite_password}@db:5432/${POSTGRES_DB:-cite_db}
      - REDIS_URL=redis://redis:6379/0
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m apps.worker.src.worker

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: cite-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
